plan: "Scope an idea into an executable plan through gates"
sprint: "Open today's work session: next step, blockers, focus"
steward: "Vault upkeep: capture new lessons, audit and prune"
gauntlet: "Stress-test any idea, price, or plan before committing"
review: "Weekly review: score the week, pick one system change"
vision: "Define the business vision and write the strategy file"
offer: "Design and price the offer: tiers, caps, guarantees"
bank: "Save lessons, costs and results into durable memory"
