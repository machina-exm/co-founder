# portable smoke case derived from evals/content-engine-draft — run graders with scripts/grade_portable.rb
---
schema_version: '1.1'
name: content-engine-draft
description: Content engine writes a voice-calibrated draft with explicit lifecycle
  metadata.
tags:
- content-engine
- lifecycle
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Write one newsletter announcing the approved 500 USD workshop. Its one job
    is to invite independent designers to reply for details. Keep every claim tied
    to the canonical offer.
graders:
- type: regex
  name: draft-lifecycle
  target: files
  pattern: 'type: content[\s\S]*content_state: draft[\s\S]*channel:'
  match: contains
  weight: 1
expected_outcome: A content draft is filed with lifecycle metadata and canonical claim
  receipts.
