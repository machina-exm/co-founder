# portable smoke case derived from evals/plan-how-build — run graders with scripts/grade_portable.rb
---
schema_version: '1.1'
name: plan-how-build
description: A decided HOW question belongs to plan, not the gauntlet.
tags:
- plan
- trigger-conflict
context:
  scaffold_script: scaffold.sh
execution:
  prompt: We already decided to run the workshop and its latest gauntlet verdict survives.
    How should we scope and build it? Scope is one live 90-minute workshop; no recorded
    course; I confirm.
graders:
- type: regex
  name: reaches-planned
  target:
    source: file
    path: wiki/initiatives/pricing-workshop.md
  pattern: 'state: planned'
  match: contains
  weight: 1
expected_outcome: Plan scopes the initiative that already survived the gauntlet and
  legally advances it to planned.
