# portable smoke case derived from evals/offer-how-price — run graders with scripts/grade_portable.rb
---
schema_version: '1.1'
name: offer-how-price
description: An approved HOW-to-structure-price question belongs to offer, not the
  gauntlet.
tags:
- offer
- trigger-conflict
context:
  scaffold_script: scaffold.sh
execution:
  prompt: We approved a bounded 500 USD workshop test for ten buyers. How should we
    structure the payment terms and guarantee? Keep it at the approved price and use
    the existing receipts.
graders:
- type: regex
  name: updates-canonical-offer
  target:
    source: file
    path: wiki/business/offer.md
  pattern: guarantee|Guarantee|Terms
  match: contains
  weight: 1
- type: regex
  name: preserves-existing-state
  target:
    source: file
    path: wiki/initiatives/pricing-workshop.md
  pattern: 'state: executing'
  match: contains
  weight: 1
expected_outcome: Offer updates the canonical offer artifact and keeps one log event.
