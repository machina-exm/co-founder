# portable smoke case derived from evals/vision-from-stub — run graders with scripts/grade_portable.rb
---
schema_version: '1.1'
name: vision-from-stub
description: Vision converts a setup stub into the canonical vision without treating
  it as complete.
tags:
- vision
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Define the vision from the existing stub. Diagnosis: buyers struggle to
    connect price to scope. Direction: teach one repeatable pricing method. Sacrifice:
    no broad freelancer course. I confirm those exact words and the quarter goal already
    in the stub.'
graders:
- type: regex
  name: canonical-vision-written
  target:
    source: file
    path: wiki/business/vision.md
  pattern: Diagnosis|buyers struggle
  match: contains
  weight: 1
expected_outcome: A canonical vision replaces the input stub and routes to plan.
