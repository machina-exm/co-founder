# portable smoke case derived from evals/steward-inbox-idempotent — run graders with scripts/grade_portable.rb
---
schema_version: '1.1'
name: steward-inbox-idempotent
description: Steward recognizes an already processed content fingerprint and writes
  nothing twice.
tags:
- steward
- idempotency
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Process raw/inbox/customer-note.txt and file it in the vault.
graders:
- type: regex
  name: one-ingest-row
  target:
    source: file
    path: log.md
  pattern: ingest \| customer-note\.txt
  match: count:1
  weight: 1
expected_outcome: The second processing request is a no-op with the existing output
  cited.
